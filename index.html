<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Solar Adder Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* PRINT SPECIFIC STYLES */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; }
            #quote-section { 
                display: block !important; 
                border: none !important; 
                box-shadow: none !important; 
                margin: 0 !important; 
                padding: 0 !important; 
            }
            /* Ensure logo prints clearly */
            img { -webkit-print-color-adjust: exact; }
        }

        /* GENERAL STYLES */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal text-gray-800">

    <div class="container mx-auto px-4 py-6 max-w-3xl">
        
        <div id="calculator-header" class="bg-white p-6 rounded-lg shadow-md mb-6 no-print text-center relative">
            <img src="logo.JPG" alt="Infinity Solar USA" class="h-24 mx-auto mb-4 object-contain">
            <h1 class="text-2xl font-bold text-gray-800">Adder Pricing Calculator</h1>
            <p id="connectionStatus" class="text-xs text-gray-400 mt-1 absolute bottom-2 right-4">Connecting...</p>
        </div>

        <div id="loadingMessage" class="text-center py-10 no-print">
            <div class="loader mb-4"></div>
            <p class="text-gray-600">Loading live pricing from Google Sheets...</p>
        </div>

        <div id="appContent" class="hidden no-print">
            
            <div class="bg-white p-6 rounded-lg shadow-md mb-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 text-xs font-bold uppercase mb-2">Market / State</label>
                        <select id="stateSelect" class="w-full border border-gray-300 p-3 rounded bg-gray-50 focus:outline-none focus:border-blue-500">
                            <option value="OR_WA">Oregon & Washington</option>
                            <option value="NM">New Mexico</option>
                            <option value="AZ_TX">Arizona & Texas</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-xs font-bold uppercase mb-2">Total System Size (kW)</label>
                        <input type="number" id="systemSize" step="0.01" placeholder="e.g. 8.5" class="w-full border border-gray-300 p-3 rounded bg-gray-50 focus:outline-none focus:border-blue-500">
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md mb-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Adders</h2>
                <div id="lineItemsContainer"></div>
                
                <button onclick="addNewRow()" class="mt-4 bg-blue-50 text-blue-700 font-bold py-3 px-4 rounded w-full border border-blue-200 hover:bg-blue-100 transition flex justify-center items-center gap-2">
                    <span>+</span> Add Another Adder
                </button>
            </div>

            <div class="mb-12 text-center">
                <button onclick="generateQuote()" class="bg-green-600 text-white font-bold py-4 px-8 rounded shadow-lg hover:bg-green-700 transition w-full md:w-auto transform hover:scale-105 duration-200">
                    Generate Quote
                </button>
            </div>
        </div>

        <div id="quote-section" class="hidden bg-white p-8 shadow-lg max-w-3xl mx-auto border-t-8 border-gray-800">
            
            <div class="flex justify-between items-start mb-8 border-b pb-6">
                <div>
                    <img src="logo.JPG" alt="Infinity Solar USA" class="h-20 mb-4 object-contain">
                    <p class="text-gray-500 text-sm" id="quoteDate">Date: </p>
                </div>
                <div class="text-right">
                    <h1 class="text-4xl font-bold text-gray-800 tracking-tight mb-2">QUOTE</h1>
                    <div class="bg-gray-50 p-4 rounded inline-block text-right">
                        <p class="text-xs text-gray-500 uppercase">System Size</p>
                        <p id="quoteSystemSize" class="font-bold text-xl mb-2">0 kW</p>
                        <p class="text-xs text-gray-500 uppercase">Market</p>
                        <p id="quoteMarket" class="font-bold text-gray-800">--</p>
                    </div>
                </div>
            </div>

            <table class="w-full mb-8 text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 border-b-2 border-gray-200">
                        <th class="py-3 px-4 font-semibold text-gray-600 text-sm uppercase">Description</th>
                        <th class="py-3 px-4 font-semibold text-gray-600 text-sm uppercase text-right">Unit Price</th>
                        <th class="py-3 px-4 font-semibold text-gray-600 text-sm uppercase text-right">Basis</th>
                        <th class="py-3 px-4 font-semibold text-gray-600 text-sm uppercase text-right">Total</th>
                    </tr>
                </thead>
                <tbody id="quoteBody" class="text-gray-700"></tbody>
                <tfoot>
                    <tr class="border-t-2 border-gray-800">
                        <td colspan="3" class="py-6 px-4 font-bold text-right text-2xl">TOTAL</td>
                        <td class="py-6 px-4 font-bold text-right text-2xl text-green-700" id="quoteGrandTotal">$0.00</td>
                    </tr>
                </tfoot>
            </table>

            <div class="no-print mt-8 pt-6 border-t border-gray-100">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <button onclick="window.print()" class="bg-blue-600 text-white font-bold py-3 px-4 rounded hover:bg-blue-700 shadow flex items-center justify-center gap-2 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                        Save as PDF
                    </button>

                    <button onclick="window.print()" class="bg-gray-800 text-white font-bold py-3 px-4 rounded hover:bg-gray-900 shadow flex items-center justify-center gap-2 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m8-12a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10V5zM9 21h6a2 2 0 002-2v-2H9v2a2 2 0 00-2 2z" /></svg>
                        Print Quote
                    </button>
                    
                    <button onclick="editQuote()" class="bg-white border-2 border-gray-300 text-gray-600 font-bold py-3 px-4 rounded hover:bg-gray-100 flex items-center justify-center gap-2 text-sm transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                        Return to Calculator
                    </button>
                </div>
            </div>

        </div>

    </div>

<script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXrTyWEN0ALtNLprPeib64_IKvZu3Dl_Gq3QJ61fRbv2KT9nRYG_rDGV7kq3gjOuqO4nSDUJQXcQ3V/pub?output=csv"; 
    // ==========================================

    let adderData = [];
    let rowCount = 0;

    window.onload = function() {
        fetchData();
    };

    function fetchData() {
        fetch(GOOGLE_SHEET_CSV_URL)
            .then(response => response.text())
            .then(csvText => {
                parseCSV(csvText);
                document.getElementById('connectionStatus').innerText = "• Live Pricing Connected";
                document.getElementById('connectionStatus').classList.add('text-green-600');
                document.getElementById('connectionStatus').classList.remove('text-gray-400');
                initializeApp();
            })
            .catch(error => {
                console.error('Error loading sheet:', error);
                alert("Could not load pricing data. Check your Google Sheet Link.");
                document.getElementById('connectionStatus').innerText = "Error Connecting";
                document.getElementById('connectionStatus').classList.add('text-red-600');
            });
    }

    function parseCSV(csvText) {
        const lines = csvText.split('\n');
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            // Handle CSV parsing (simple split by comma)
            const cols = line.split(',');
            
            if (cols.length >= 5) {
                adderData.push({
                    name: cols[0].trim(),
                    type: cols[1].trim(), // watt, flat, unit, sq, lf
                    prices: {
                        OR_WA: parseFloat(cols[2]),
                        NM: parseFloat(cols[3]),
                        AZ_TX: parseFloat(cols[4])
                    }
                });
            }
        }
    }

    function initializeApp() {
        document.getElementById('loadingMessage').style.display = 'none';
        document.getElementById('appContent').classList.remove('hidden');
        addNewRow();
    }

    function formatCurrency(num) {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
    }

    function addNewRow() {
        rowCount++;
        const container = document.getElementById('lineItemsContainer');
        const rowId = `row-${rowCount}`;

        let optionsHtml = '<option value="">Select an Adder...</option>';
        adderData.forEach((item, index) => {
            optionsHtml += `<option value="${index}">${item.name}</option>`;
        });

        const rowHtml = `
            <div id="${rowId}" class="adder-row bg-gray-50 p-3 rounded border border-gray-200 mb-3 flex flex-col md:flex-row gap-3 items-center">
                <div class="flex-grow w-full">
                    <select class="adder-select w-full p-3 border border-gray-300 rounded bg-white font-medium text-gray-700 outline-none" onchange="handleItemSelect('${rowId}')">
                        ${optionsHtml}
                    </select>
                </div>
                <div class="qty-container w-full md:w-32 hidden">
                    <div class="relative">
                        <input type="number" class="adder-qty w-full p-3 border border-gray-300 rounded text-center font-bold" value="1" placeholder="Qty">
                        <span class="qty-label absolute right-3 top-3 text-xs text-gray-400 font-bold uppercase pointer-events-none"></span>
                    </div>
                </div>
                <div class="w-full md:w-auto text-right md:text-center">
                    <button onclick="removeRow('${rowId}')" class="text-red-400 hover:text-red-600 p-2">Remove</button>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', rowHtml);
    }

    function removeRow(id) { document.getElementById(id).remove(); }

    function handleItemSelect(rowId) {
        const row = document.getElementById(rowId);
        const select = row.querySelector('.adder-select');
        const qtyContainer = row.querySelector('.qty-container');
        const qtyLabel = row.querySelector('.qty-label');
        const index = select.value;

        if (index === "") { qtyContainer.classList.add('hidden'); return; }

        const item = adderData[index];
        if (item.type === 'watt' || item.type === 'flat') {
            qtyContainer.classList.add('hidden');
        } else {
            qtyContainer.classList.remove('hidden');
            qtyLabel.innerText = item.type === 'sq' ? "SQ" : (item.type === 'lf' ? "FT" : "QTY");
            row.querySelector('.adder-qty').focus();
        }
    }

    function generateQuote() {
        const state = document.getElementById('stateSelect').value;
        const size = parseFloat(document.getElementById('systemSize').value);

        if (!size || size <= 0) { alert("Please enter a valid System Size (kW)."); return; }

        const rows = document.querySelectorAll('.adder-row');
        const quoteBody = document.getElementById('quoteBody');
        quoteBody.innerHTML = '';
        
        let grandTotal = 0;
        let hasItems = false;

        rows.forEach(row => {
            const select = row.querySelector('.adder-select');
            const qtyInput = row.querySelector('.adder-qty');
            if (select.value === "") return; 

            hasItems = true;
            const item = adderData[select.value];
            const qty = parseFloat(qtyInput.value) || 1; 
            let unitPrice = item.prices[state];
            
            if (isNaN(unitPrice)) unitPrice = 0;

            let lineTotal = 0;
            let basisText = "";

            if (item.type === 'watt') {
                lineTotal = unitPrice * (size * 1000);
                basisText = `${(size*1000).toLocaleString()} watts`;
            } else if (item.type === 'flat') {
                lineTotal = unitPrice;
                basisText = "Flat Rate";
            } else {
                lineTotal = unitPrice * qty;
                let unitName = item.type === 'sq' ? 'Squares' : (item.type === 'lf' ? 'Feet' : 'Units');
                basisText = `${qty} ${unitName}`;
            }

            grandTotal += lineTotal;
            quoteBody.insertAdjacentHTML('beforeend', `
                <tr class="border-b border-gray-100">
                    <td class="py-4 px-4 font-medium">${item.name}</td>
                    <td class="py-4 px-4 text-right text-gray-600">${item.type==='watt'?formatCurrency(unitPrice)+'/w':formatCurrency(unitPrice)}</td>
                    <td class="py-4 px-4 text-right text-gray-600">${basisText}</td>
                    <td class="py-4 px-4 text-right font-bold">${formatCurrency(lineTotal)}</td>
                </tr>
            `);
        });

        if (!hasItems) { alert("Please add at least one adder."); return; }

        const marketNames = { 'OR_WA': 'Oregon & Washington', 'NM': 'New Mexico', 'AZ_TX': 'Arizona & Texas' };
        document.getElementById('quoteMarket').innerText = marketNames[state];
        document.getElementById('quoteSystemSize').innerText = size + " kW";
        document.getElementById('quoteDate').innerText = "Date: " + new Date().toLocaleDateString();
        document.getElementById('quoteGrandTotal').innerText = formatCurrency(grandTotal);

        // Hide calculator, show quote
        document.getElementById('calculator-header').style.display = 'none';
        document.getElementById('appContent').style.display = 'none';
        
        document.getElementById('quote-section').classList.remove('hidden');
        document.getElementById('quote-section').style.display = 'block';
        window.scrollTo(0,0);
    }

    function editQuote() {
        // Show calculator, hide quote
        document.getElementById('calculator-header').style.display = 'block';
        document.getElementById('appContent').style.display = 'block';
        
        document.getElementById('quote-section').classList.add('hidden');
        document.getElementById('quote-section').style.display = 'none';
    }

</script>
</body>
</html>
